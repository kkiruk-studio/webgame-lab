<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kkiruk webgame lab</title>
<style>
:root{color-scheme:light dark;--bg:#fafafa;--fg:#111;--mut:#666;--ln:#ddd;--ac:#0a64d8}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#f2f2f2;--mut:#999;--ln:#333;--ac:#6cb0ff}}
body{margin:0;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 0}
h1{font-size:22px;margin:0 0 16px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--ln)}
li{border-bottom:1px solid var(--ln)}
a{display:block;padding:14px 0;color:var(--ac);text-decoration:none}
</style>
</head>
<body>
<main>
<h1>kkiruk webgame lab</h1>
<ul>
<li><a href="games/blank/">Blank canvas (touch test)</a></li>
<li><a href="games/love-verdict/">오늘의 연애판결 (Love Verdict)</a></li>
</ul>
</main>
</body>
</html>
