<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b211c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Passeggiata — 신사의 산책</title>
<style>
:root{
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --padL:max(12px,var(--sal));--padR:max(12px,var(--sar));
  --ink:#2b211c;--paper:#f4ead5;--paper2:#e9dcc0;--line:#cdbb97;--muted:#7a6a58;
  --terra:#b8592f;--terra2:#94451f;--olive:#5f6e34;--olive2:#4c5a29;--gold:#d9a93a;--navy:#2f3d5c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2b211c;overscroll-behavior:none}
body{position:fixed;inset:0;height:100dvh;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;color:var(--ink);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Helvetica Neue",sans-serif}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

/* 픽셀 보더 패널 */
.panel{background:var(--paper);border:2px solid var(--ink);
  box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--line),3px 3px 0 rgba(43,33,28,.35)}
.btn{border:2px solid var(--ink);background:var(--paper2);padding:7px 12px;font-weight:700;
  box-shadow:inset -2px -2px 0 rgba(43,33,28,.18),inset 2px 2px 0 rgba(255,255,255,.45),2px 2px 0 rgba(43,33,28,.4)}
.btn:active{transform:translate(1px,1px);box-shadow:inset 2px 2px 0 rgba(43,33,28,.2)}
.btn.primary{background:var(--olive);color:#f6efdf}
.btn.terra{background:var(--terra);color:#f6efdf}
.btn.small{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45}
.ui{position:absolute;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}

/* HUD */
#hud{position:absolute;top:calc(var(--sat) + 6px);left:var(--padL);right:var(--padR);height:28px;display:flex;gap:6px;align-items:center;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:5px;height:26px;padding:0 9px;background:rgba(244,234,213,.94);border:2px solid var(--ink);font-weight:700;font-size:12px}
.chip img{width:14px;height:14px}
#hud .spacer{flex:1}
#bookBtn{width:32px;height:28px;padding:0;display:flex;align-items:center;justify-content:center}
#bookBtn img{width:18px;height:18px}
#timewrap{flex:1;max-width:360px;height:12px;border:2px solid var(--ink);background:rgba(244,234,213,.9);margin-left:6px}
#timebar{height:100%;width:100%;background:var(--olive);transition:none}
#timebar.low{background:var(--terra)}

/* 토스트 */
#toast{position:absolute;left:50%;top:calc(var(--sat) + 42px);transform:translateX(-50%);max-width:min(78vw,560px);
  padding:7px 12px;font-weight:600;text-align:center;z-index:8;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
body:not([data-scene=walk]) #toast{top:calc(var(--sat) + 5px);max-width:52vw;padding:4px 10px;font-size:12px}

/* 걷기 프롬프트 */
#prompt{position:absolute;right:calc(var(--padR) + 6px);bottom:calc(max(var(--sab),6px) + 8px);padding:8px 16px 10px;min-width:200px;max-width:min(72vw,440px);text-align:center;font-weight:800;font-size:15px;pointer-events:none}
#prompt small{display:block;font-weight:700;font-size:12px;color:var(--muted);margin-top:2px}
#promptBar{position:relative;height:6px;background:var(--paper2);border:1px solid var(--ink);margin-top:7px;width:100%}
#promptBar i{position:absolute;top:0;bottom:0;display:block}
#pbFill{left:0;width:100%;background:var(--terra)}
#pbZone{background:var(--olive)}
#pbMark{top:-4px!important;bottom:-4px!important;width:3px;margin-left:-1px;background:var(--ink)}
/* 강아지 기분 칩 */
#moodChip{gap:4px;padding:0 7px}
#moodBar{display:flex;gap:1px}
#moodBar i{display:block;width:5px;height:10px;border:1px solid var(--ink)}
#moodBar i.on{background:var(--olive)}
#moodChip.low #moodBar i.on{background:var(--terra)}

/* 강아지 선택 */
#ui-dog .wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100vw - var(--padL) - var(--padR)),640px);padding:14px 16px;text-align:center}
#ui-dog h1{font-size:17px;margin:0 0 2px}
#ui-dog p.sub{margin:0 0 10px;color:var(--muted);font-size:12px}
.dogs{display:flex;gap:10px;justify-content:center}
.dogcard{flex:1;max-width:180px;padding:8px 6px;border:2px solid var(--ink);background:var(--paper2)}
.dogcard canvas{width:100%;height:72px;display:block}
.dogcard b{display:block;font-size:14px}
.dogcard span{font-size:11px;color:var(--muted)}
.dogcard.on{background:#fff8e6;outline:3px solid var(--olive);outline-offset:-5px}
.namerow{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px}
.namerow input{font-size:16px;padding:6px 8px;border:2px solid var(--ink);background:#fffaf0;width:150px;border-radius:0;color:var(--ink)}

/* 옷장 */
#wardPanel{position:absolute;top:calc(var(--sat) + 40px);bottom:calc(max(var(--sab),6px) + 4px);right:var(--padR);width:min(55%,500px);display:flex;flex-direction:column;padding:8px 10px;gap:6px}
.inforow{display:flex;align-items:center;gap:8px;font-weight:700}
.inforow img{width:18px;height:18px}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px;text-shadow:1px 1px 0 var(--ink)}
.stars .off{color:#cdbb97;text-shadow:none}
.hint{font-size:12px;background:#fff8e6;border:1px dashed var(--muted);padding:4px 7px;line-height:1.3}
.tabs{display:flex;gap:3px}
.tab{flex:1;padding:4px 0;font-size:11px;font-weight:700;border:2px solid var(--ink);background:var(--paper2)}
.tab.on{background:var(--ink);color:var(--paper)}
.grid{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:5px;align-content:start}
.cell{border:2px solid var(--ink);background:#fffaf0;padding:3px 2px;text-align:center;font-size:10.5px;line-height:1.15;position:relative;min-height:74px}
.cell img{height:46px;max-width:100%;display:block;margin:0 auto 2px;image-rendering:pixelated}
.cell.on{background:#eef0d8;outline:2px solid var(--olive);outline-offset:-5px}
.cell .tag{position:absolute;top:2px;right:2px;font-size:9px;background:var(--olive);color:#f6efdf;padding:0 3px}
.cell.none{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.foot{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.foot .spacer{flex:1}
#gearBtn{position:absolute;left:var(--padL);bottom:calc(max(var(--sab),6px) + 4px);width:26px;height:26px;padding:0;font-size:14px;opacity:.75;background:rgba(244,234,213,.85);border:2px solid var(--ink)}
#gearMenu{position:absolute;left:var(--padL);bottom:calc(max(var(--sab),6px) + 36px);padding:8px;display:flex;flex-direction:column;gap:5px;z-index:9}

/* 결산 */
#resPanel{position:absolute;top:calc(var(--sat) + 40px);bottom:calc(max(var(--sab),6px) + 4px);left:var(--padL);right:var(--padR);padding:8px 10px;display:flex;gap:12px}
.shot{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:center;min-width:0}
.shot img{display:block;max-height:calc(100% - 40px);max-width:100%;height:auto;image-rendering:pixelated;border:2px solid var(--ink)}
.resinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.resinfo h2{margin:0;font-size:16px}
.row{display:flex;justify-content:space-between;gap:6px;font-size:12.5px}
.row b{font-variant-numeric:tabular-nums}
.total{border-top:1px solid var(--line);padding-top:4px;font-weight:800}
.nbrs{display:flex;flex-direction:column;gap:2px;font-size:12px}
.hearts{color:#c8452f;letter-spacing:1px}
.hearts .off{color:#cdbb97}
.plus{color:var(--olive);font-weight:800}
.badge{font-size:9.5px;font-weight:800;background:var(--olive);color:#f6efdf;padding:0 3px;margin-left:3px}
.minus{color:var(--terra2)}
.diary{font-size:12.5px;font-style:italic;background:#fff8e6;border-left:3px solid var(--terra);padding:5px 8px;line-height:1.4}
.resinfo .foot{margin-top:auto}

/* 상점 */
#shopPanel{position:absolute;top:calc(var(--sat) + 40px);bottom:calc(max(var(--sab),6px) + 4px);left:var(--padL);right:var(--padR);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
#shopPanel .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
#shopPanel .cell{min-height:96px}
.price{font-weight:800;color:var(--terra2)}
.cell .st{color:var(--gold);font-size:10px}

/* 엔딩 도감 */
#endPanel{position:absolute;top:calc(var(--sat) + 40px);bottom:calc(max(var(--sab),6px) + 4px);left:var(--padL);right:var(--padR);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.ecards{flex:1;min-height:0;display:flex;gap:8px}
.ecard{flex:1;min-width:0;border:2px solid var(--ink);background:#fffaf0;padding:6px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.ecard img{width:100%;image-rendering:pixelated;border:2px solid var(--ink);display:block}
.ecard b{font-size:13px}
.ecard p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.3}
.ecard .btn{margin-top:auto;align-self:flex-start}
.ecard.locked{background:var(--paper2)}

/* 엔딩 씬 */
#ui-ending{background:#0d0b0a;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(var(--sat) + 10px) var(--padR) calc(var(--sab) + 10px) var(--padL);color:#efe6cf}
#ui-ending img{height:min(52vh,260px);image-rendering:pixelated;border:3px solid #efe6cf}
#eTitle{font-size:12px;letter-spacing:3px;color:#cdbb97}
#eText{min-height:3.2em;max-width:min(86vw,620px);text-align:center;font-size:15px;line-height:1.55}
#eTap{font-size:11px;color:#8a7f68;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* 세로 경고 */
#rotate{position:fixed;inset:0;z-index:50;background:#2b211c;color:#f4ead5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:700;font-size:15px;text-align:center;touch-action:none}
#rotate svg{width:96px;height:96px;shape-rendering:crispEdges}
@media (orientation:portrait){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){#eTap{animation:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="chip" id="hudDay">Day 1</div>
  <div class="chip"><img class="px" id="hudCoinImg" alt=""><span id="hudCoins">0</span></div>
  <div id="timewrap" hidden><div id="timebar"></div></div>
  <div class="chip" id="moodChip" hidden aria-label="강아지 기분"><span aria-hidden="true">🐾</span><span id="moodBar"><i></i><i></i><i></i><i></i></span></div>
  <div class="spacer"></div>
  <button class="btn" id="bookBtn" aria-label="엔딩 도감"><img class="px" id="bookImg" alt=""></button>
</div>

<div class="ui" data-scene="dog" id="ui-dog" hidden>
  <div class="wrap panel">
    <h1>Passeggiata — 신사의 산책</h1>
    <p class="sub">매일 아침, 가장 멋진 모습으로. 함께 걸을 강아지를 골라주세요.</p>
    <div class="dogs" id="dogCards"></div>
    <div class="namerow">
      <label for="dogName">이름</label>
      <input id="dogName" maxlength="10" autocomplete="off" placeholder="Bruno">
      <button class="btn primary" id="dogStart">산책 시작</button>
    </div>
  </div>
</div>

<div class="ui" data-scene="wardrobe" id="ui-wardrobe" hidden>
  <div id="wardPanel" class="panel">
    <div class="inforow"><img class="px" id="wIcon" alt=""><span id="wWeather">맑음</span><span style="color:var(--muted);font-weight:600">· 오늘의 코디</span><span class="stars" id="wStars"></span></div>
    <div class="hint" id="wHint"></div>
    <div class="tabs" id="wTabs"></div>
    <div class="grid" id="wGrid"></div>
    <div class="foot"><span id="wDesc" style="font-size:11px;color:var(--muted);flex:1;min-width:0"></span><button class="btn" id="wShop">상점</button><button class="btn primary" id="wGo">산책 나가기</button></div>
  </div>
  <button class="btn" id="gearBtn" aria-label="테스트 메뉴">⚙</button>
  <div id="gearMenu" class="panel" hidden>
    <button class="btn small" id="tCoins">테스트: 코인 +200</button>
    <button class="btn small" id="tBoost">테스트: 호감·발견 +2</button>
    <button class="btn small terra" id="tReset">진행 초기화</button>
  </div>
</div>

<div class="ui" data-scene="walk" id="ui-walk" hidden>
  <div id="prompt" class="panel" hidden><span id="promptText">인사하기</span><small id="promptSub"></small><div id="promptBar"><i id="pbFill"></i><i id="pbZone"></i><i id="pbMark"></i></div></div>
</div>

<div class="ui" data-scene="result" id="ui-result" hidden>
  <div id="resPanel" class="panel">
    <div class="shot"><img id="rShot" alt="오늘의 한 컷"><button class="btn small" id="rShare">한 컷 공유</button></div>
    <div class="resinfo">
      <h2 id="rTitle">귀가</h2>
      <div>
        <div class="row"><span>길에서 주운 코인</span><b id="rPick">0</b></div>
        <div class="row"><span>강아지의 발견</span><b id="rFind">0</b></div>
        <div class="row"><span>코디 보너스 <span class="stars" id="rStars"></span></span><b id="rBonus">0</b></div>
        <div class="row minus" id="rDirtRow" hidden><span>옷 더러워짐</span><b id="rDirt">−0★</b></div>
        <div class="row total"><span>오늘 번 코인</span><b id="rTotal">0</b></div>
        <div class="row" id="rRouteRow" hidden><span>경로</span><b id="rRoute"></b></div>
        <div class="row" id="rMoodRow" hidden><span>강아지 기분</span><b id="rMood"></b></div>
      </div>
      <div class="nbrs" id="rNbrs"></div>
      <div class="diary" id="rDiary"></div>
      <div class="foot"><button class="btn" id="rShop">상점</button><button class="btn primary" id="rNext">내일 산책</button></div>
    </div>
  </div>
</div>

<div class="ui" data-scene="shop" id="ui-shop" hidden>
  <div id="shopPanel" class="panel">
    <div class="inforow"><span>사르토리아 — 상점</span><span style="color:var(--muted);font-weight:600;font-size:11px">사면 바로 입어요</span></div>
    <div class="grid" id="sGrid"></div>
    <div class="foot"><span id="sDesc" style="font-size:11px;color:var(--muted);flex:1"></span><button class="btn primary" id="sBack">옷장으로</button></div>
  </div>
</div>

<div class="ui" data-scene="endings" id="ui-endings" hidden>
  <div id="endPanel" class="panel">
    <div class="inforow"><span>엔딩 도감</span><span style="color:var(--muted);font-weight:600;font-size:11px" id="eCount"></span></div>
    <div class="ecards" id="eCards"></div>
    <div class="foot"><button class="btn primary" id="eBack">돌아가기</button></div>
  </div>
</div>

<div class="ui" data-scene="ending" id="ui-ending" hidden>
  <div id="eTitle"></div>
  <img id="eArt" alt="">
  <div id="eText"></div>
  <div id="eTap">탭하여 계속</div>
</div>

<div id="toast" class="panel"></div>

<div id="rotate">
  <svg viewBox="0 0 16 16" aria-hidden="true">
    <rect x="2" y="5" width="12" height="7" fill="#f4ead5"/><rect x="3" y="6" width="10" height="5" fill="#5f6e34"/>
    <rect x="13" y="8" width="1" height="1" fill="#2b211c"/>
    <rect x="3" y="1" width="5" height="1" fill="#d9a93a"/><rect x="8" y="2" width="1" height="1" fill="#d9a93a"/><rect x="9" y="3" width="1" height="1" fill="#d9a93a"/><rect x="8" y="3" width="1" height="1" fill="#d9a93a"/><rect x="10" y="3" width="1" height="1" fill="#d9a93a"/>
    <rect x="12" y="14" width="1" height="1" fill="#d9a93a"/><rect x="7" y="14" width="5" height="1" fill="#d9a93a"/><rect x="6" y="13" width="1" height="1" fill="#d9a93a"/><rect x="5" y="13" width="1" height="1" fill="#d9a93a"/><rect x="6" y="12" width="1" height="1" fill="#d9a93a"/><rect x="6" y="14" width="1" height="1" fill="#d9a93a"/>
  </svg>
  <div>가로로 돌려주세요</div>
  <div style="font-size:12px;font-weight:600;color:#cdbb97">Passeggiata는 가로 화면 게임이에요</div>
</div>

<script src="sprites.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
